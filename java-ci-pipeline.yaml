pipeline:
  id: app_delivery_orchestrator
  name: Application Delivery Orchestrator
  description: >-
    Central orchestrator for application build, package,
    containerize, release tagging and release promotion.
  inputs:
    app_branch:
      type: string
      desc: Application branch received from entry pipeline.
      required: true
    run_build_verify:
      type: string
      default: "true"
      desc: Run application build and verification.
    run_package_publish:
      type: string
      default: "true"
      desc: Run package and publish.
    run_containerize:
      type: string
      default: "true"
      desc: Run containerization.
    run_release_tag:
      type: string
      default: "false"
      desc: Run release tagging after approval.
    run_release_promotion:
      type: string
      default: "false"
      desc: Run GitOps release promotion.
  stages:
    - id: build_and_verify
      name: Build and Verify
      if: <+OnPipelineSuccess> && '<+inputs.run_build_verify>' == 'true'
      chain:
        uses: default/Harness_demo/harness_app_build_verify_v2
        with:
          inputs:
            branch: ${{ inputs.app_branch }}

    - id: package_and_publish
      name: Package and Publish
      if: <+OnPipelineSuccess> && '<+inputs.run_package_publish>' == 'true'
      chain:
        uses: default/Harness_demo/cicd_app_package_and_publish

    - id: containerize
      name: Containerize
      if: <+OnPipelineSuccess> && '<+inputs.run_containerize>' == 'true'
      chain:
        uses: default/Harness_demo/App-containerize

    - id: release_tag
      name: Release Tag
      if: <+OnPipelineSuccess> && '<+inputs.run_release_tag>' == 'true'
      chain:
        uses: default/Harness_demo/cicd_app_release_tag

    - id: release_promotion
      name: Release Promotion
      if: <+OnPipelineSuccess> && '<+inputs.run_release_promotion>' == 'true' && '<+inputs.run_release_tag>' == 'true'
      chain:
        uses: default/Harness_demo/cicd_release_promotion_trigger
